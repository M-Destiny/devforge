name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract service name
        id: vars
        run: echo "SERVICE_NAME=${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ steps.vars.outputs.SERVICE_NAME }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ steps.vars.outputs.SERVICE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ github.repository }}-${{ steps.vars.outputs.SERVICE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests
        run: |
          cd services/${{ steps.vars.outputs.SERVICE_NAME }}
          npm ci
          npm test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/{{{"{{"}}}/services/api-gateway/deployment.yaml
          kubectl apply -f k8s/{{{"{{"}}}/services/api-gateway/service.yaml
          kubectl apply -f k8s/{{{"{{"}}}/services/auth-service/deployment.yaml
          kubectl apply -f k8s/{{{"{{"}}}/services/auth-service/service.yaml
          kubectl apply -f k8s/{{{"{{"}}}/services/user-service/deployment.yaml
          kubectl apply -f k8s/{{{"{{"}}}/services/user-service/service.yaml
          kubectl apply -f k8s/{{{"{{"}}}/databases/postgres.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment -n production

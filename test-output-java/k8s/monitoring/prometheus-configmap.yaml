apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'test-platform'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: api-gateway
      - job_name: 'api-gateway'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{../project.namespace}}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: api-gateway
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "8080"
      - job_name: 'auth-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{../project.namespace}}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: auth-service
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "3001"
      - job_name: 'user-service'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - {{../project.namespace}}
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: user-service
          - source_labels:
              - __meta_kubernetes_pod_container_port_number
            action: keep
            regex: "8081"
      - job_name: 'postgres'
        static_configs:
          - targets:
              - postgres.{{../project.namespace}}.svc.cluster.local:5432

version: '3.9'

services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - SERVICE_DEPENDENCIES=

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: "30s"
      timeout: "10s"
      retries: 3
    depends_on:
      - 
    networks:
      - devforge-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: "30s"
      timeout: "10s"
      retries: 3
    depends_on:
    networks:
      - devforge-network
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - SERVICE_DEPENDENCIES=

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: "30s"
      timeout: "10s"
      retries: 3
    depends_on:
      - 
    networks:
      - devforge-network
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      - POSTGRES_SIZE=10Gi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgres
    networks:
      - devforge-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  devforge-network:
    driver: bridge
